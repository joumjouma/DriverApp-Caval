<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suivi Caval</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --o:#FF6F00; --t:#17130F; --m:#6F6862; --bg:#FAF8F5; --s:#fff; --b:#ECE8E3; }
  @media (prefers-color-scheme: dark) { :root { --t:#F5F1EC; --m:#A59D95; --bg:#121110; --s:#1C1A18; --b:#34302B; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--t); }
  #map { position: fixed; inset: 0 0 auto 0; height: 58vh; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; min-height: 44vh; background: var(--s); border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(0,0,0,.08); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--o); }
  .over { margin-top: 16px; font-size: 13px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: #B84A00; }
  h1 { margin: 4px 0 14px; font-size: 24px; line-height: 1.2; }
  .card { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--bg); border: 1px solid var(--b); }
  .card img, .avatar { width: 48px; height: 48px; border-radius: 24px; object-fit: cover; background: #FFE0C7; display: grid; place-items: center; font-weight: 800; color: #B84A00; }
  .muted { color: var(--m); font-size: 14px; }
  .plate { margin-left: auto; padding: 6px 10px; border: 1.5px solid var(--t); border-radius: 8px; font-weight: 800; }
  .row { margin-top: 12px; font-size: 15px; }
  .foot { margin-top: 16px; font-size: 13px; color: var(--m); }
  a { color: #B84A00; }
</style>
</head>
<body>
<div id="map" aria-hidden="true"></div>
<main class="sheet">
  <div class="brand"><span class="mark"></span>Caval</div>
  <div class="over" id="over">Suivi en direct</div>
  <h1 id="title">Chargement…</h1>
  <div class="card" id="driver" hidden></div>
  <div class="row" id="route"></div>
  <p class="foot">Mis à jour automatiquement. <a href="https://www.caval.tech">caval.tech</a></p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const token = location.pathname.split("/").filter(Boolean).pop();
  const LABELS = {
    ride: { waiting: "Recherche d'un chauffeur", driver_selected: "Recherche d'un chauffeur", assigned: "Chauffeur en route",
      driver_arrived: "Chauffeur arrivé", arrived_at_pickup: "Chauffeur arrivé", picked_up: "En route vers la destination",
      completed: "Arrivé à destination", cancelled: "Course annulée", declined: "Course annulée" },
    delivery: { waiting: "Recherche d'un livreur", driver_selected: "Recherche d'un livreur", assigned: "Livreur en route vers le colis",
      driver_arrived: "Livreur au point de retrait", arrived_at_pickup: "Livreur au point de retrait", picked_up: "Colis en route vers vous",
      completed: "Colis livré", cancelled: "Livraison annulée", declined: "Livraison annulée" },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([11.589, 43.145], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const dot = (color) => L.divIcon({ className: "", html: `<div style="width:16px;height:16px;border-radius:8px;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>` });
  let markers = {}, fitted = false;
  function place(key, pos, color) {
    if (!pos || pos.lat == null) return;
    if (!markers[key]) markers[key] = L.marker([pos.lat, pos.lng], { icon: dot(color) }).addTo(map);
    else markers[key].setLatLng([pos.lat, pos.lng]);
  }
  // Supabase first (public RPC track_ride, publishable key is meant to be public),
  // then the old Firebase function for links made before the switch.
  const SUPABASE_URL = "https://ysuoieejgophdyrcotnv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_fi7REKnxGTcMx1NggU_WdA_RXrCDGJY";
  async function load() {
    try {
      const s = await fetch(`${SUPABASE_URL}/rest/v1/rpc/track_ride`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
        body: JSON.stringify({ p_token: token }),
      });
      if (s.ok) { const d = await s.json(); if (d && !d.error) return { ok: true, d }; }
    } catch (e) { /* fall back */ }
    const r = await fetch(`/api/track?t=${encodeURIComponent(token)}`);
    return r.ok ? { ok: true, d: await r.json() } : { ok: false, status: r.status };
  }
  async function refresh() {
    try {
      const res = await load();
      if (!res.ok) {
        document.getElementById("title").textContent = res.status === 404 ? "Ce lien a expiré." : "Suivi indisponible.";
        return;
      }
      const d = res.d;
      const labels = LABELS[d.serviceType === "delivery" ? "delivery" : "ride"];
      document.getElementById("over").textContent = d.serviceType === "delivery" ? (d.recipientName ? `Colis pour ${d.recipientName}` : "Livraison Caval") : "Course Caval";
      document.getElementById("title").textContent = labels[d.status] || "En cours";
      document.getElementById("route").innerHTML = `<span class="muted">De</span> ${esc(d.pickup.address || "—")}<br><span class="muted">À</span> ${esc(d.destination.address || "—")}`;
      const el = document.getElementById("driver");
      if (d.driver) {
        el.hidden = false;
        el.innerHTML = (d.driver.photo ? `<img src="${esc(d.driver.photo)}" alt="">` : `<div class="avatar">${esc((d.driver.firstName || "C")[0])}</div>`) +
          `<div><strong>${esc(d.driver.firstName || "Chauffeur")}</strong><div class="muted">${esc([d.driver.car, d.driver.color].filter(Boolean).join(" · "))}</div></div>` +
          (d.driver.plate ? `<span class="plate">${esc(d.driver.plate)}</span>` : "");
        place("driver", d.driver.position, "#17130F");
      }
      place("pickup", d.pickup, "#FF6F00");
      place("dest", d.destination, "#444");
      if (!fitted) {
        const pts = [d.pickup, d.destination, d.driver && d.driver.position].filter((p) => p && p.lat != null).map((p) => [p.lat, p.lng]);
        if (pts.length) { map.fitBounds(pts, { padding: [40, 40] }); fitted = true; }
      }
      if (["completed", "cancelled", "declined"].includes(d.status)) return; // stop polling
      setTimeout(refresh, 10000);
    } catch (e) {
      setTimeout(refresh, 15000);
    }
  }
  refresh();
</script>
</body>
</html>
