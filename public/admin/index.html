<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Caval — Administration</title>
<style>
  :root { --o:#FF6F00; --ot:#B84A00; --t:#17130F; --m:#6F6862; --bg:#FAF8F5; --s:#fff; --b:#ECE8E3; --r:#8E1C1C; --g:#146C34; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--t); font-size: 14px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--s); border-bottom: 1px solid var(--b); position: sticky; top: 0; z-index: 2; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--o); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: 16px; }
  nav button { border: 0; background: transparent; padding: 8px 12px; border-radius: 10px; font-weight: 600; color: var(--m); cursor: pointer; }
  nav button.on { background: #FFF1E6; color: var(--ot); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  h2 { margin: 0 0 12px; font-size: 20px; }
  .card { background: var(--s); border: 1px solid var(--b); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--b); vertical-align: top; }
  th { color: var(--m); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1.5px solid var(--b); border-radius: 10px; background: var(--s); color: var(--t); }
  textarea { width: 100%; min-height: 260px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  button.p, button.s, button.d { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer; }
  button.p { background: var(--o); color: #1F1300; } button.s { background: #F3F0EC; color: var(--t); } button.d { background: transparent; color: var(--r); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .muted { color: var(--m); } .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #F3F0EC; font-size: 12px; font-weight: 700; }
  .chip.g { background: #E8F5EC; color: var(--g); } .chip.o { background: #FFF1E6; color: var(--ot); }
  #login { max-width: 360px; margin: 10vh auto; } #login input { width: 100%; margin-bottom: 10px; }
  .err { color: var(--r); } .split { display: grid; grid-template-columns: 320px 1fr; gap: 14px; }
  .msgs { max-height: 50vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 75%; background: #F3F0EC; } .msg.support { align-self: flex-end; background: #FFE0C7; }
  .pick { cursor: pointer; } .pick:hover { background: #FFF7F0; }
</style>
</head>
<body>
<header><span class="mark"></span><strong>Caval · Administration</strong><nav id="nav" hidden></nav><span style="margin-left:auto" id="who" class="muted"></span></header>
<main id="app">
  <div id="login" class="card">
    <h2>Connexion</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="p" id="go">Se connecter</button>
    <p class="err" id="loginErr"></p>
    <p class="muted">Accès réservé aux comptes administrateurs (functions/scripts/set-admin.js).</p>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, getDocs, doc, getDoc, setDoc, updateDoc, addDoc, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

const app = initializeApp({ apiKey: "AIzaSyBMQW59pFle0vVp0xotmnpVTYqAlTbdbQQ", authDomain: "eco-share-92ef1.firebaseapp.com", projectId: "eco-share-92ef1",
  storageBucket: "eco-share-92ef1.firebasestorage.app" });
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (ts) => ts?.toDate ? ts.toDate().toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) : "";
let stop = [];
const clearSubs = () => { stop.forEach((f) => f()); stop = []; };

$("go").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); }
  catch (e) { $("loginErr").textContent = "Connexion refusée."; }
};

const TABS = { rides: "Courses", drivers: "Chauffeurs", support: "Support", whatsapp: "WhatsApp", promo: "Codes promo", business: "Entreprises", settings: "Réglages" };
onAuthStateChanged(auth, async (u) => {
  if (!u) return;
  const t = await u.getIdTokenResult(true);
  if (!t.claims.admin) { $("loginErr").textContent = "Ce compte n'est pas administrateur."; await signOut(auth); return; }
  $("who").innerHTML = `${esc(u.email)} · <a href="#" id="out">Déconnexion</a>`;
  $("out").onclick = (e) => { e.preventDefault(); signOut(auth).then(() => location.reload()); };
  $("nav").hidden = false;
  $("nav").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${v}</button>`).join("");
  $("nav").querySelectorAll("button").forEach((b) => (b.onclick = () => show(b.dataset.t)));
  show("rides");
});

function show(tab) {
  clearSubs();
  $("nav").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
  ({ rides, drivers, support, whatsapp, promo, business, settings })[tab]();
}

// ---------- Courses en cours
const ACTIVE = ["waiting", "driver_selected", "assigned", "driver_arrived", "arrived_at_pickup", "picked_up", "scheduled"];
function rides() {
  $("app").innerHTML = `<h2>Courses en cours</h2><div class="card"><table><thead><tr><th>Créée</th><th>Statut</th><th>Service</th><th>Trajet</th><th>Chauffeur</th><th>Prix</th><th></th></tr></thead><tbody id="rb"></tbody></table></div>`;
  stop.push(onSnapshot(query(collection(db, "rideRequests"), where("status", "in", ACTIVE), limit(150)), (s) => {
    const rows = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $("rb").innerHTML = rows.map((r) => `<tr><td>${fmt(r.createdAt)}${r.scheduledFor ? `<br><span class="chip o">prog. ${fmt(r.scheduledFor)}</span>` : ""}</td>
      <td><span class="chip ${r.status === "waiting" ? "o" : "g"}">${esc(r.status)}</span></td>
      <td>${esc(r.serviceType || "ride")} · ${esc(r.rideType)}</td>
      <td>${esc(r.pickupAddress || "")}<br><span class="muted">→ ${esc(r.destinationAddress || "")}</span></td>
      <td>${esc(r.driverName || "—")}</td><td>${esc(r.fare)} Fdj</td>
      <td><button class="d" data-c="${r.id}">Annuler</button></td></tr>`).join("") || `<tr><td colspan="7" class="muted">Aucune course en cours.</td></tr>`;
    $("rb").querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => confirm("Annuler cette course ?") &&
      updateDoc(doc(db, "rideRequests", b.dataset.c), { status: "cancelled", cancelledBy: "admin", cancelledAt: serverTimestamp() })));
  }, (e) => ($("rb").innerHTML = `<tr><td class="err">${esc(e.message)}</td></tr>`)));
}

// ---------- Chauffeurs en attente
function drivers() {
  $("app").innerHTML = `<h2>Chauffeurs en attente de validation</h2><div class="card"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Véhicule</th><th>Type</th><th></th></tr></thead><tbody id="db"></tbody></table></div>`;
  stop.push(onSnapshot(query(collection(db, "Drivers"), where("approvalStatus", "==", "pending"), limit(100)), (s) => {
    $("db").innerHTML = s.docs.map((d) => { const x = d.data(); return `<tr><td>${esc(x.firstName)} ${esc(x.lastName)}</td><td>${esc(x.phoneNumber)}</td>
      <td>${esc([x.carMake, x.carModel, x.carColor, x.plaqueImmatriculation].filter(Boolean).join(" · "))}</td><td>${esc(x.driverType)}</td>
      <td><button class="p" data-a="${d.id}">Valider</button> <button class="d" data-r="${d.id}">Refuser</button></td></tr>`; }).join("")
      || `<tr><td colspan="5" class="muted">Personne en attente.</td></tr>`;
    const set = (id, ok) => updateDoc(doc(db, "Drivers", id), { isApproved: ok, approvalStatus: ok ? "approved" : "rejected",
      approvedBy: auth.currentUser.email, approvalDate: serverTimestamp(), documentsVerified: ok });
    $("db").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => set(b.dataset.a, true)));
    $("db").querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => confirm("Refuser ce chauffeur ?") && set(b.dataset.r, false)));
  }));
}

// ---------- Support
function support() {
  $("app").innerHTML = `<h2>Support</h2><div class="split"><div class="card" id="tl"></div><div class="card" id="tv"><p class="muted">Choisissez une conversation.</p></div></div>`;
  stop.push(onSnapshot(query(collection(db, "supportTickets"), where("status", "in", ["open", "answered"]), orderBy("updatedAt", "desc"), limit(100)), (s) => {
    $("tl").innerHTML = s.docs.map((d) => { const t = d.data(); return `<div class="pick card" data-id="${d.id}" style="margin:0 0 8px">
      <strong>${esc(t.subject || "Sans objet")}</strong> ${t.unreadBySupport ? '<span class="chip o">nouveau</span>' : ""}<br>
      <span class="muted">${esc(t.userName || t.uid)} · ${fmt(t.updatedAt)}</span><br>${esc(t.lastMessage || "")}</div>`; }).join("") || `<p class="muted">Aucune demande ouverte.</p>`;
    $("tl").querySelectorAll("[data-id]").forEach((el) => (el.onclick = () => openTicket(el.dataset.id)));
  }));
}
let ticketSub = null;
function openTicket(id) {
  ticketSub?.();
  updateDoc(doc(db, "supportTickets", id), { unreadBySupport: false }).catch(() => {});
  $("tv").innerHTML = `<div class="msgs" id="ml"></div><div class="row"><input id="rt" style="flex:1" placeholder="Votre réponse"><button class="p" id="rs">Envoyer</button>
    <button class="s" id="rc">Clore</button></div>`;
  ticketSub = onSnapshot(query(collection(db, "supportTickets", id, "messages"), orderBy("at", "asc")), (s) => {
    $("ml").innerHTML = s.docs.map((d) => { const m = d.data(); return `<div class="msg ${m.from}">${esc(m.text)}<br><span class="muted" style="font-size:11px">${fmt(m.at)}</span></div>`; }).join("");
    $("ml").scrollTop = 1e9;
  });
  stop.push(() => ticketSub?.());
  $("rs").onclick = async () => {
    const text = $("rt").value.trim(); if (!text) return;
    await addDoc(collection(db, "supportTickets", id, "messages"), { text, from: "support", authorUid: auth.currentUser.uid, at: serverTimestamp() });
    $("rt").value = "";
  };
  $("rc").onclick = () => updateDoc(doc(db, "supportTickets", id), { status: "closed" });
}

// ---------- WhatsApp
function whatsapp() {
  $("app").innerHTML = `<h2>Messages WhatsApp à traiter</h2><div class="card"><table><thead><tr><th>Reçu</th><th>Type</th><th>Client</th><th>Message / position</th><th></th></tr></thead><tbody id="wb"></tbody></table></div>`;
  stop.push(onSnapshot(query(collection(db, "whatsappLeads"), where("status", "==", "new"), orderBy("createdAt", "desc"), limit(100)), (s) => {
    $("wb").innerHTML = s.docs.map((d) => { const l = d.data(); const digits = String(l.phone || "").replace(/\D/g, "");
      return `<tr><td>${fmt(l.createdAt)}</td><td><span class="chip ${l.type === "ride" ? "o" : ""}">${esc(l.type)}</span></td>
      <td>${esc(l.name || "")}<br><a href="https://wa.me/${digits}" target="_blank" rel="noopener">${esc(l.phone)}</a></td>
      <td>${l.lat ? `<a href="https://maps.google.com/?q=${l.lat},${l.lng}" target="_blank" rel="noopener">Voir la position</a>` : esc(l.text || "")}</td>
      <td><button class="s" data-h="${d.id}">Traité</button></td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">Rien à traiter.</td></tr>`;
    $("wb").querySelectorAll("[data-h]").forEach((b) => (b.onclick = () => updateDoc(doc(db, "whatsappLeads", b.dataset.h),
      { status: "handled", handledBy: auth.currentUser.email, handledAt: serverTimestamp() })));
  }));
}

// ---------- Codes promo
function promo() {
  $("app").innerHTML = `<h2>Codes promo</h2><div class="card"><div class="row">
    <input id="pc" placeholder="CODE" style="text-transform:uppercase;width:130px"><select id="pt"><option value="amount">Montant (Fdj)</option><option value="percent">Pourcentage</option></select>
    <input id="pv" type="number" placeholder="Valeur" style="width:100px"><input id="pm" type="number" placeholder="Utilisations max" style="width:140px">
    <input id="pu" type="number" placeholder="Par client (1)" style="width:120px"><label><input id="pf" type="checkbox"> 1re course seulement</label>
    <input id="pe" type="date" title="Expire le"><input id="pl" placeholder="Libellé (facultatif)">
    <button class="p" id="padd">Créer</button></div><p class="err" id="perr"></p></div>
    <div class="card"><table><thead><tr><th>Code</th><th>Réduction</th><th>Utilisé</th><th>Expire</th><th>Actif</th></tr></thead><tbody id="pb"></tbody></table></div>`;
  $("padd").onclick = async () => {
    const code = $("pc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ""), value = Number($("pv").value);
    if (!code || !value) return ($("perr").textContent = "Code et valeur obligatoires.");
    const ref = doc(db, "promoCodes", code);
    if ((await getDoc(ref)).exists()) return ($("perr").textContent = "Ce code existe déjà.");
    await setDoc(ref, { active: true, type: $("pt").value, value, usedCount: 0, maxUses: Number($("pm").value) || null, perUser: Number($("pu").value) || 1,
      firstRideOnly: $("pf").checked, label: $("pl").value.trim() || null,
      expiresAt: $("pe").value ? Timestamp.fromDate(new Date($("pe").value + "T23:59:59")) : null, createdAt: serverTimestamp() });
    $("perr").textContent = ""; $("pc").value = ""; $("pv").value = "";
  };
  stop.push(onSnapshot(collection(db, "promoCodes"), (s) => {
    $("pb").innerHTML = s.docs.map((d) => { const p = d.data(); return `<tr><td><strong>${esc(d.id)}</strong> <span class="muted">${esc(p.label || "")}</span></td>
      <td>${p.type === "percent" ? `${esc(p.value)} %` : `${esc(p.value)} Fdj`}${p.firstRideOnly ? ' <span class="chip">1re course</span>' : ""}</td>
      <td>${esc(p.usedCount || 0)}${p.maxUses ? ` / ${esc(p.maxUses)}` : ""}</td><td>${p.expiresAt ? fmt(p.expiresAt) : "—"}</td>
      <td><input type="checkbox" data-p="${d.id}" ${p.active !== false ? "checked" : ""}></td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">Aucun code.</td></tr>`;
    $("pb").querySelectorAll("[data-p]").forEach((c) => (c.onchange = () => updateDoc(doc(db, "promoCodes", c.dataset.p), { active: c.checked })));
  }));
}

// ---------- Entreprises
function business() {
  $("app").innerHTML = `<h2>Entreprises</h2><div class="card"><div class="row"><input id="bn" placeholder="Nom de l'entreprise"><input id="be" placeholder="Email de facturation">
    <button class="p" id="badd">Créer</button></div></div>
    <div class="card"><div class="row"><select id="bsel"><option value="">Toutes les courses</option></select><input id="bm" type="month">
    <button class="s" id="brep">Télécharger le relevé (CSV)</button><span id="bres" class="muted"></span></div>
    <table><thead><tr><th>Entreprise</th><th>Code d'invitation</th><th>Membres</th><th>Active</th></tr></thead><tbody id="bb"></tbody></table></div>`;
  $("bm").value = new Date().toISOString().slice(0, 7);
  $("badd").onclick = async () => {
    const name = $("bn").value.trim(); if (!name) return;
    const inviteCode = "ENT" + Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
    await addDoc(collection(db, "businesses"), { name, billingEmail: $("be").value.trim() || null, inviteCode, active: true, memberUids: [], adminUids: [], createdAt: serverTimestamp() });
    $("bn").value = ""; $("be").value = "";
  };
  stop.push(onSnapshot(collection(db, "businesses"), (s) => {
    $("bsel").innerHTML = `<option value="">Toutes les courses</option>` + s.docs.map((d) => `<option value="${d.id}">${esc(d.data().name)}</option>`).join("");
    $("bb").innerHTML = s.docs.map((d) => { const b = d.data(); return `<tr><td>${esc(b.name)}<br><span class="muted">${esc(b.billingEmail || "")}</span></td>
      <td><strong>${esc(b.inviteCode)}</strong></td><td>${(b.memberUids || []).length}</td>
      <td><input type="checkbox" data-b="${d.id}" ${b.active ? "checked" : ""}></td></tr>`; }).join("") || `<tr><td colspan="4" class="muted">Aucune entreprise.</td></tr>`;
    $("bb").querySelectorAll("[data-b]").forEach((c) => (c.onchange = () => updateDoc(doc(db, "businesses", c.dataset.b), { active: c.checked })));
  }));
  $("brep").onclick = async () => {
    $("bres").textContent = "…";
    try {
      const { data } = await httpsCallable(fns, "adminMonthlyReport")({ businessId: $("bsel").value || null, month: $("bm").value });
      const cols = ["id", "date", "service", "passenger", "from", "to", "km", "driver", "fare"];
      const csv = [cols.join(";"), ...data.rows.map((r) => cols.map((c) => `"${String(r[c] ?? "").replace(/"/g, '""')}"`).join(";"))].join("\n");
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })),
        download: `caval-${$("bm").value}${$("bsel").value ? "-" + $("bsel").selectedOptions[0].text : ""}.csv` });
      a.click();
      $("bres").textContent = `${data.count} courses · ${data.total} Fdj`;
    } catch (e) { $("bres").textContent = e.message; }
  };
}

// ---------- Réglages
const FLAGS = { packagesEnabled: "Colis", schedulingEnabled: "Courses programmées", stopsEnabled: "Arrêts", promoEnabled: "Codes promo",
  rewardsEnabled: "Récompenses / parrainage", femaleDriversEnabled: "Conductrice si possible", hourlyEnabled: "Mise à disposition",
  pickupPinEnabled: "Code de prise en charge", receiptsEnabled: "Reçus WhatsApp", businessEnabled: "Comptes entreprise", supportChatEnabled: "Chat support",
  shareLinkEnabled: "Lien de suivi" };
async function settings() {
  const cfgRef = doc(db, "appConfig", "customer"), priceRef = doc(db, "appConfig", "pricing");
  const [cfg, pr] = await Promise.all([getDoc(cfgRef), getDoc(priceRef)]);
  const c = cfg.data() || {};
  $("app").innerHTML = `<h2>Réglages de l'application client</h2>
    <div class="card"><p class="muted">Activez une fonction seulement quand le serveur et l'app chauffeur sont prêts (voir docs/CUSTOMER_FEATURES.md).</p>
    ${Object.entries(FLAGS).map(([k, v]) => `<label class="row"><input type="checkbox" data-f="${k}" ${c[k] ? "checked" : ""}> ${v} <span class="muted">(${k})</span></label>`).join("")}</div>
    <div class="card"><h2>Tarifs (appConfig/pricing)</h2><p class="muted">JSON. Laissez vide pour les valeurs par défaut du serveur. Appliqué en 1 minute.</p>
    <textarea id="pj">${esc(JSON.stringify(pr.data() || {}, null, 2))}</textarea>
    <div class="row"><button class="p" id="ps">Enregistrer les tarifs</button><span id="pmsg" class="muted"></span></div></div>`;
  document.querySelectorAll("[data-f]").forEach((el) => (el.onchange = () => setDoc(cfgRef, { [el.dataset.f]: el.checked }, { merge: true })));
  $("ps").onclick = async () => {
    try { await setDoc(priceRef, JSON.parse($("pj").value || "{}")); $("pmsg").textContent = "Enregistré."; }
    catch (e) { $("pmsg").textContent = e instanceof SyntaxError ? "JSON invalide." : e.message; }
  };
}
</script>
</body>
</html>
