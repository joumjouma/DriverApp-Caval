<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nouveau mot de passe · Caval</title>
<style>
  :root { --o:#FF6F00; --t:#17130F; --m:#6F6862; --bg:#FAF8F5; --s:#fff; --b:#ECE8E3; --e:#B3261E; --ok:#1E7B3A; }
  @media (prefers-color-scheme: dark) { :root { --t:#F5F1EC; --m:#A59D95; --bg:#121110; --s:#1C1A18; --b:#34302B; --e:#FF8A80; --ok:#7BD88F; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--t); }
  main { width: 100%; max-width: 380px; background: var(--s); border: 1px solid var(--b); border-radius: 24px; padding: 28px 24px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--o); }
  h1 { font-size: 24px; margin: 18px 0 6px; }
  p { color: var(--m); margin: 0 0 18px; line-height: 1.45; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 12px 0 6px; }
  input { width: 100%; height: 50px; padding: 0 14px; font-size: 17px; border-radius: 14px; border: 1.5px solid var(--b); background: var(--bg); color: var(--t); }
  input:focus { outline: none; border-color: var(--o); }
  button { width: 100%; height: 54px; margin-top: 20px; border: 0; border-radius: 16px; background: var(--o); color: #1B0F05; font-size: 17px; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 14px; font-weight: 700; }
  .err { color: var(--e); } .ok { color: var(--ok); }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark"></span>Caval</div>
  <h1>Nouveau mot de passe</h1>
  <p id="intro">Choisissez un nouveau mot de passe pour votre compte Caval.</p>
  <form id="f" hidden>
    <label for="p1">Nouveau mot de passe</label>
    <input id="p1" type="password" minlength="6" autocomplete="new-password" required>
    <label for="p2">Confirmez</label>
    <input id="p2" type="password" minlength="6" autocomplete="new-password" required>
    <button id="go" type="submit">Enregistrer</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>
<script type="module">
  // Opened from the password-reset email. Supabase puts a one-time session in
  // the link; with it, the person can set a new password, then sign in in the app.
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  const sb = createClient("https://ysuoieejgophdyrcotnv.supabase.co", "sb_publishable_fi7REKnxGTcMx1NggU_WdA_RXrCDGJY",
    { auth: { persistSession: false, detectSessionInUrl: true, flowType: "implicit" } });
  const $ = (id) => document.getElementById(id);
  const say = (text, ok) => { $("msg").textContent = text; $("msg").className = "msg " + (ok ? "ok" : "err"); };

  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $("intro").textContent = "Ce lien a expiré ou a déjà servi. Dans l'application, touchez « Mot de passe oublié » pour en recevoir un nouveau.";
  } else {
    $("f").hidden = false;
  }
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    if ($("p1").value.length < 6) return say("Au moins 6 caractères.");
    if ($("p1").value !== $("p2").value) return say("Les deux mots de passe ne sont pas identiques.");
    $("go").disabled = true;
    const { error } = await sb.auth.updateUser({ password: $("p1").value });
    $("go").disabled = false;
    if (error) return say(error.code === "same_password" ? "Choisissez un mot de passe différent de l'ancien." : "Impossible d'enregistrer. Redemandez un lien depuis l'application.");
    $("f").hidden = true;
    $("intro").textContent = "";
    say("C'est fait. Retournez dans l'application Caval et connectez-vous avec votre nouveau mot de passe.", true);
    await sb.auth.signOut();
  });
</script>
</body>
</html>
